spring:
  application:
    name: vtx-srv-gestao-usuario
    version: ${APP_VERSION:1.0.0}
  data:
    jdbc:
      dialect: mysql
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:60000}
      jedis:
        pool:
          enabled: ${REDIS_POOL_ENABLED:true}
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:0}
          max-wait: ${REDIS_POOL_MAX_WAIT:-1ms}
  datasource:
    url: jdbc:${JDBC_DB:mysql}://${DB_URL:localhost:3306}/${DB_NAME:vtx-local}?useSSL=${USE_SSL:false}&serverTimezone=${TIMEZONE:UTC}
    password: ${DB_PASSWORD:root}
    username: ${DB_USERNAME:root}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
  cache:
    redis:
      enable-statistics: ${REDIS_ENABLE_STATISTICS:true}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}

